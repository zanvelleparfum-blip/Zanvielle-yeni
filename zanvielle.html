<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZANVIELLE — Extrait de Parfum</title>
<style>
:root{--gold:#ead79a;--gold2:#c8a84b;--black:#050706;--cream:#f7efd9;--panel:rgba(7,9,8,.965);--line:rgba(234,215,154,.34);--muted:#c9c3b4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706;color:#fff}body{font-family:Georgia,"Times New Roman",serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--gold)}
.stage{position:fixed;inset:0;overflow:hidden;background:#050706;display:grid;place-items:center}.reference{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.05))}
.ticker{position:absolute;top:0;left:0;right:0;height:34px;background:rgba(3,7,6,.9);border-bottom:1px solid var(--line);display:flex;align-items:center;overflow:hidden;z-index:20;font:600 10px/1 Arial,sans-serif;letter-spacing:2px;color:var(--cream);white-space:nowrap}.ticker-track{display:inline-flex;gap:48px;min-width:max-content;animation:marquee 25s linear infinite}@keyframes marquee{to{transform:translateX(-50%)}}
.hotspot{position:absolute;z-index:25;border:1px solid rgba(234,215,154,.78);background:rgba(12,12,9,.42);color:var(--cream);border-radius:999px;min-width:64px;height:40px;padding:0 12px;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(234,215,154,.07);backdrop-filter:blur(4px);transition:.2s}.hotspot:hover,.hotspot:active{transform:scale(1.06);background:rgba(10,10,8,.78)}.hotspot span{font:700 9px Arial,sans-serif;letter-spacing:1.4px}.hs-men{left:8%;top:55%}.hs-women{left:25%;top:61%}.hs-unisex{left:40%;top:56%}.hs-lotion{left:54%;top:63%}.hs-other{left:70%;top:57%}
.click-zone{position:absolute;z-index:24;border:0;background:transparent}.shop-zone{left:3%;top:39%;width:42%;height:10%}.cart-zone{right:3%;top:2%;width:9%;height:9%}.account-zone{right:12%;top:2%;width:9%;height:9%}.menu-zone{left:2%;top:2%;width:10%;height:9%}
.overlay{position:absolute;inset:0;z-index:50;pointer-events:none}.panel{pointer-events:auto;position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.7);backdrop-filter:blur(18px);color:#fff;display:none;overflow:hidden}.panel.open{display:flex;flex-direction:column}.shop-panel{left:3vw;right:3vw;top:7vh;bottom:5vh;border-radius:20px}.detail-panel{left:5vw;right:5vw;top:7vh;bottom:5vh;border-radius:20px}.cart-panel{right:2.5vw;top:7vh;bottom:4vh;width:min(510px,95vw);border-radius:18px}.menu-panel{left:0;top:0;bottom:0;width:min(390px,90vw);border-radius:0 20px 20px 0;transform:translateX(-102%);transition:transform .25s ease;display:flex}.menu-panel.open{transform:translateX(0)}.admin-panel{left:4vw;top:7vh;width:min(900px,92vw);height:min(84vh,820px);border-radius:18px}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.panel-title{flex:1;font-size:19px;letter-spacing:2px;color:var(--cream)}.sub{font:10px Arial,sans-serif;letter-spacing:1px;color:var(--muted);margin-top:4px}.close{width:38px;height:38px;border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:50%;font-size:21px}.panel-body{padding:16px;overflow:auto;min-height:0}.categories{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.cat{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--cream);padding:9px 12px;border-radius:30px;font:700 9px Arial,sans-serif;letter-spacing:1.3px}.cat.active,.cat:hover{background:var(--gold);color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:rgba(255,255,255,.045);border:1px solid rgba(234,215,154,.17);border-radius:12px;padding:10px;min-width:0}.card-img{height:150px;border-radius:9px;background:radial-gradient(circle at 50% 25%,#9d7b30 0,#292313 35%,#080908 70%);display:grid;place-items:center;margin-bottom:9px;overflow:hidden;color:#ead79a}.card-img img{width:100%;height:100%;object-fit:cover}.bottle{width:58px;height:92px;border:1px solid #d9c07b;border-radius:9px 9px 14px 14px;display:grid;place-items:center;background:linear-gradient(90deg,#1c1810,#c69a38,#18140d);color:#ead79a;font:700 8px Arial;letter-spacing:1px}.card h3{font-size:13px;line-height:1.15;margin:0 0 6px;color:#fff}.price{font:700 13px Arial,sans-serif;color:var(--gold);margin:5px 0}.oldprice{text-decoration:line-through;color:#8e897d;font-weight:400;margin-right:5px}.stock{font:10px Arial,sans-serif;color:#bdb7a5;margin-bottom:8px}.actions{display:flex;gap:6px}.btn{flex:1;border:1px solid var(--line);background:transparent;color:var(--cream);padding:9px 7px;border-radius:7px;font:700 9px Arial,sans-serif;letter-spacing:.7px}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}.btn.danger{border-color:#8d4b43;color:#ffd5cf}.btn:disabled{opacity:.35;cursor:not-allowed}
.detail{display:grid;grid-template-columns:42% 58%;gap:22px}.detail-img{min-height:400px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle,#a77d27,#1a160e 48%,#070807 80%);display:grid;place-items:center;overflow:hidden}.detail-img img{width:100%;height:100%;object-fit:cover}.detail-copy h2{font-size:28px;line-height:1.05;margin:0 0 7px;color:var(--cream)}.detail-copy p{font:13px/1.55 Arial,sans-serif;color:#e4dfd1;white-space:pre-line}.notes{display:grid;gap:7px;margin:13px 0}.note{border-left:2px solid var(--gold2);padding:8px 11px;background:rgba(255,255,255,.035)}.note b{display:block;font:700 9px Arial,sans-serif;letter-spacing:2px;color:var(--gold);margin-bottom:3px}.note span{font:12px/1.4 Arial,sans-serif;color:#eee}.qty{display:flex;align-items:center;gap:11px;margin:13px 0}.qty button{width:35px;height:35px;border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:50%}.qty strong{min-width:25px;text-align:center;font:700 15px Arial,sans-serif}
.cart-item{display:grid;grid-template-columns:58px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid rgba(234,215,154,.15);align-items:center}.thumb{width:58px;height:66px;border-radius:8px;background:radial-gradient(circle,#9d762b,#12130e);display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.cart-item h4{margin:0 0 4px;font-size:12px}.cart-item .mini{font:10px Arial,sans-serif;color:#c9c3b1}.summary{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font:12px Arial,sans-serif}.row{display:flex;justify-content:space-between;margin:7px 0}.total{font-weight:800;color:var(--gold);font-size:16px}.empty{padding:45px 15px;text-align:center;color:#c9c3b1;font:13px Arial,sans-serif}
.menu-body{padding:18px;overflow:auto}.menu-logo{font-size:27px;letter-spacing:5px;color:var(--cream);margin:4px 0 4px}.menu-kicker{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--gold);margin-bottom:20px}.menu-link{width:100%;padding:13px 10px;border:0;border-bottom:1px solid rgba(234,215,154,.13);background:transparent;color:#eee;text-align:left;font:700 11px Arial,sans-serif;letter-spacing:1.4px}.menu-link:hover{color:var(--gold)}.contact-title{font:700 9px Arial,sans-serif;letter-spacing:2px;color:var(--gold);margin:22px 0 6px}.contact-link{display:block;color:#ddd;text-decoration:none;padding:9px 0;font:12px Arial,sans-serif}
.admin-body{display:grid;grid-template-columns:245px 1fr;min-height:0;flex:1}.admin-list{border-right:1px solid var(--line);overflow:auto;padding:9px}.admin-list button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#ddd;padding:9px;border-radius:7px;font:10px Arial,sans-serif}.admin-list button.active,.admin-list button:hover{background:rgba(234,215,154,.12);color:var(--cream)}.form{padding:15px;overflow:auto}.field{margin-bottom:11px}.field label{display:block;font:700 9px Arial,sans-serif;letter-spacing:1.4px;color:var(--gold);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(234,215,154,.28);background:#0e110f;color:#fff;border-radius:7px;padding:9px;font:12px Arial,sans-serif}.field textarea{min-height:90px;resize:vertical}.admin-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.badge{font:700 9px Arial,sans-serif;letter-spacing:1px;padding:6px 8px;border:1px solid var(--line);border-radius:15px;color:var(--cream)}.login{max-width:380px;margin:auto;padding:24px}.login h2{text-align:center;color:var(--cream);letter-spacing:3px}.drag-handle{cursor:move;user-select:none}.admin-preview{width:90px;height:90px;border:1px solid var(--line);border-radius:8px;object-fit:cover;background:#15120b}.settings-box{border:1px solid var(--line);padding:13px;border-radius:10px;margin-bottom:12px}.settings-box h3{font-size:14px;color:var(--cream);margin:0 0 12px;letter-spacing:1px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card-img{height:125px}.shop-panel{left:2.5vw;right:2.5vw;top:5vh;bottom:3vh}.detail-panel{left:2.5vw;right:2.5vw;top:3vh;bottom:3vh}.detail{grid-template-columns:1fr;gap:12px}.detail-img{min-height:210px;max-height:235px}.detail-copy h2{font-size:22px}.admin-body{grid-template-columns:1fr}.admin-list{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}.admin-panel{left:2.5vw;top:4vh;width:95vw;height:88vh}.hotspot{min-width:57px;height:35px;padding:0 9px}.hotspot span{font-size:8px}.hs-men{left:5%;top:58%}.hs-women{left:23%;top:65%}.hs-unisex{left:39%;top:59%}.hs-lotion{left:55%;top:67%}.hs-other{left:73%;top:60%}}
@media(max-width:480px){.ticker{height:30px;font-size:8px}.card{padding:8px}.card h3{font-size:11px}.card-img{height:110px}.panel-head{padding:11px 12px}.panel-title{font-size:14px}.panel-body{padding:11px}.btn{font-size:8px;padding:8px 5px}.hotspot{min-width:54px;height:33px}.hotspot span{font-size:7px;letter-spacing:1px}.hs-men{left:4%;top:59%}.hs-women{left:22%;top:67%}.hs-unisex{left:39%;top:60%}.hs-lotion{left:54%;top:69%}.hs-other{left:72%;top:61%}}
</style>

function openDetail(id){selectedProduct=products.find(p=>p.id===id);if(!selectedProduct)return;$('#shopPanel').classList.remove('open');$('#detailPanel').classList.add('open');const p=selectedProduct;const pic=p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'<div class="bottle">ZANVIELLE</div>';const notes=(p.notes||[]).filter(n=>n.text).map(n=>`<div class="note"><b>${esc(n.label)}</b><span>${esc(n.text)}</span></div>`).join('');const price=p.salePrice?`<div class="price"><span class="oldprice">${money(p.price)}</span>${money(p.salePrice)}</div>`:`<div class="price">${money(p.price)}</div>`;$('#detailBody').innerHTML=`<div class="detail"><div class="detail-img">${pic}</div><div class="detail-copy"><h2>${esc(p.name)}</h2><div class="sub">${esc(p.category)} • ${Number(p.stock)>0?'STOKTA':'STOKTA YOK'}</div>${price}<p>${esc(p.description||'')}</p><div class="notes">${notes||'<div class="note"><b>KOKU NOTALARI</b><span>Yönetici tarafından henüz eklenmedi.</span></div>'}</div><div class="qty"><button onclick="detailQty(-1)">−</button><strong id="detailQty">1</strong><button onclick="detailQty(1)">+</button></div><button class="btn primary" style="width:100%" ${Number(p.stock)<=0?'disabled':''} onclick="addToCart(${p.id},Number($('#detailQty').textContent))">SEPETE EKLE</button></div></div>`}

function addToCart(id,qty){const p=products.find(x=>x.id===id);if(!p||Number(p.stock)<=0)return;const max=Number(p.stock);cart[id]=Math.min(max,(Number(cart[id])||0)+qty);persist();updateCartBadge();renderCart()}

function renderCart(){const ids=Object.keys(cart).filter(id=>cart[id]>0);let subtotal=0,totalQty=0;$('#cartItems').innerHTML=ids.map(id=>{const p=products.find(x=>x.id==id);if(!p)return '';const q=Math.min(Number(cart[id]),Number(p.stock)||0);cart[id]=q;if(q<=0)return '';const unit=Number(p.salePrice||p.price);subtotal+=unit*q;totalQty+=q;const pic=p.image?`<img src="${p.image}" alt="">`:'<div class="bottle" style="transform:scale(.65)">Z</div>';return `<div class="cart-item"><div class="thumb">${pic}</div><div><h4>${esc(p.name)}</h4><div class="mini">${money(unit)} × ${q}</div><div class="qty" style="margin:6px 0 0"><button onclick="cartQty(${p.id},-1)">−</button><strong>${q}</strong><button onclick="cartQty(${p.id},1)">+</button></div></div><button class="btn danger" onclick="removeCart(${p.id})">SİL</button></div>`}).join('')||'<div class="empty">Sepetiniz boş.</div>';persist();$('#cartCount').textContent=`${totalQty} ürün`;$('#subtotal').textContent=money(subtotal);$('#grandTotal').textContent=money(subtotal)}
function cartQty(id,d){const p=products.find(x=>x.id===id);if(!p)return;cart[id]=Math.max(0,Math.min(Number(p.stock)||0,(Number(cart[id])||0)+d));if(!cart[id])delete cart[id];persist();renderCart()}
function removeCart(id){delete cart[id];persist();renderCart()}

function renderAdmin(){if(sessionStorage.getItem('zanvielle_admin_v2')!=='1')return renderAdminLogin();adminSelected=Math.min(adminSelected,Math.max(0,products.length-1));$('#adminContent').innerHTML=`<div class="admin-tools" style="padding:10px 14px 0"><span class="badge">${products.length} ÜRÜN</span><span class="badge">${products.filter(p=>p.visible!==false).length} GÖRÜNÜR</span><button class="btn primary" onclick="newProduct()">+ ÜRÜN EKLE</button><button class="btn" onclick="renderSettings()">SİTE AYARLARI</button><button class="btn" onclick="logoutAdmin()">ÇIKIŞ</button></div><div class="admin-body"><div class="admin-list" id="adminList"></div><div class="form" id="adminForm"></div></div>`;renderAdminList();renderAdminForm()}
function renderAdminList(){const q='';$('#adminList').innerHTML=products.map((p,i)=>`<button class="${i===adminSelected?'active':''}" onclick="adminSelected=${i};renderAdminList();renderAdminForm()">${i+1}. ${esc(p.name)}</button>`).join('')||'<div class="empty">Ürün yok.</div>'}
function renderAdminForm(){const p=products[adminSelected];if(!p){$('#adminForm').innerHTML='<div class="empty">Ürün seçin.</div>';return}$('#adminForm').innerHTML=`<div class="field"><label>ÜRÜN ADI</label><input id="fName" value="${esc(p.name)}"></div><div class="field"><label>KATEGORİ</label><select id="fCat">${['Erkek','Kadın','Unisex','Losyonlar','Diğer'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>FİYAT</label><input id="fPrice" type="number" value="${Number(p.price)||0}"></div><div class="field"><label>İNDİRİMLİ FİYAT (boş = yok)</label><input id="fSale" type="number" value="${p.salePrice??''}"></div><div class="field"><label>STOK</label><input id="fStock" type="number" min="0" value="${Number(p.stock)||0}"></div><div class="field"><label>AÇIKLAMA</label><textarea id="fDesc">${esc(p.description||'')}</textarea></div><div class="field"><label>KOKU NOTALARI — her satır: Üst|notalar</label><textarea id="fNotes">${(p.notes||[]).map(n=>`${n.label}|${n.text}`).join('\n')}</textarea></div><div class="field"><label>ÜRÜN GÖRSELİ</label><div style="display:flex;gap:10px;align-items:center"><img class="admin-preview" id="imgPrev" src="${p.image||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2290%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%2315110b%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 fill=%22%23ead79a%22 font-size=%2210%22%3EZANVIELLE%3C/text%3E%3C/svg%3E'}><input id="fImage" type="file" accept="image/*" onchange="previewImage(this)"></div></div><div class="field"><label><input id="fVisible" type="checkbox" ${p.visible!==false?'checked':''}> ÜRÜN GÖRÜNÜR</label></div><div class="admin-tools"><button class="btn primary" onclick="saveProduct()">DEĞİŞİKLİKLERİ KAYDET</button><button class="btn danger" onclick="deleteProduct()">ÜRÜNÜ SİL</button></div>`}
function previewImage(input){if(!input.files[0])return;const reader=new FileReader();reader.onload=()=>{$('#imgPrev').src=reader.result;$('#imgPrev').dataset.newImage=reader.result};reader.readAsDataURL(input.files[0])}
function saveProduct(){const p=products[adminSelected];p.name=$('#fName').value.trim();p.category=$('#fCat').value;p.price=Number($('#fPrice').value)||0;p.salePrice=$('#fSale').value===''?null:Number($('#fSale').value)||0;p.stock=Math.max(0,Number($('#fStock').value)||0);p.description=$('#fDesc').value;p.notes=$('#fNotes').value.split('\n').filter(Boolean).map(x=>{const a=x.split('|');return{label:(a.shift()||'').trim(),text:a.join('|').trim()}}).filter(x=>x.text);p.visible=$('#fVisible').checked;if($('#imgPrev').dataset.newImage)p.image=$('#imgPrev').dataset.newImage;persist();renderAdmin();renderProducts();alert('Ürün kaydedildi. Bu tarayıcıdaki site verisi güncellendi.')}
function newProduct(){products.push({id:Date.now(),name:'Yeni Zanvielle Ürünü',description:'',price:699,salePrice:null,currency:'TL',stock:1,category:'Diğer',notes:[],image:'',visible:true});adminSelected=products.length-1;persist();renderAdmin()}
function deleteProduct(){const p=products[adminSelected];if(!p)return;if(!confirm(`"${p.name}" silinsin mi?`))return;products.splice(adminSelected,1);adminSelected=Math.max(0,adminSelected-1);persist();renderAdmin();renderProducts()}
function renderSettings(){const s=settings;$('#adminContent').innerHTML=`<div class="form" style="flex:1"><div class="settings-box"><h3>SİTE / İLETİŞİM AYARLARI</h3><div class="field"><label>KAYAN YAZILAR — her satır bir mesaj</label><textarea id="sTicker">${esc(s.ticker.join('\n'))}</textarea></div><div class="field"><label>E-POSTA</label><input id="sEmail" value="${esc(s.email)}"></div><div class="field"><label>WHATSAPP NUMARASI</label><input id="sWhats" value="${esc(s.whatsapp)}"></div><div class="field"><label>INSTAGRAM BAĞLANTISI</label><input id="sInsta" value="${esc(s.instagram)}"></div><button class="btn primary" onclick="saveSettings()">SİTE AYARLARINI KAYDET</button></div><button class="btn" onclick="renderAdmin()">ÜRÜNLERE DÖN</button></div>`}
function saveSettings(){settings.ticker=$('#sTicker').value.split('\n').map(x=>x.trim()).filter(Boolean);settings.email=$('#sEmail').value.trim();settings.whatsapp=$('#sWhats').value.trim();settings.instagram=$('#sInsta').value.trim();persist();renderTicker();renderAdmin();alert('Site ayarları kaydedildi.')}
function logoutAdmin(){sessionStorage.removeItem('zanvielle_admin_v2');renderAdminLogin()}
(function(){const panel=$('#adminPanel'),handle=$('#adminDrag');let dragging=false,ox=0,oy=0;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;handle.setPointerCapture(e.pointerId);const r=panel.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top});handle.addEventListener('pointermove',e=>{if(!dragging)return;panel.style.left=Math.max(4,Math.min(innerWidth-panel.offsetWidth-4,e.clientX-ox))+'px';panel.style.top=Math.max(34,Math.min(innerHeight-panel.offsetHeight-4,e.clientY-oy))+'px';panel.style.right='auto'});handle.addEventListener('pointerup',()=>dragging=false)})();
renderTicker();updateCartBadge();
</script>
</body>
</html>
